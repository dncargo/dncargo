name: Dnevni Backup Projekta

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  create-backup-artifact:
    name: Generisanje ZIP Bekapa
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Arhiviraj projekat (ZIP)
        run: |
          zip -r dn-cargo-backup-$(date +%F).zip . -x ".git/*"

      - name: Sačuvaj ZIP kao Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: dnevni-bekap-koda
          path: *.zip
          retention-days: 30
